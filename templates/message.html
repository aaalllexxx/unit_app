{% extends 'base.html' %}
{% from '_icons.html' import icon %}
{% block title %}{{ title }} — Лаборатория UNIT{% endblock %}
{% block content %}
<div class="panel center-card">
  <div class="panel-body stack-sm" style="padding: 30px">
    <h1 style="font-size: 24px">{{ title }}</h1>
    <p class="muted">{{ text }}</p>
  </div>
  <div class="panel-foot row"><a class="btn btn-ghost" href="{{ '/home' if me else '/' }}">{{ icon('back', 15) }}На главную</a>{% if not me %}<a class="btn btn-primary spacer" href="/login">Войти</a>{% endif %}</div>
</div>
{% endblock %}
