{% from '_icons.html' import icon %}
<div class="chat" data-chat {% if chat_thread %}data-thread="{{ chat_thread }}"{% endif %} {% if chat_ask %}data-ask="{{ chat_ask }}"{% endif %}>
  <div class="chat-log" data-chat-log>
    <div class="chat-empty" data-chat-empty>
      <span class="ai-mark">{{ icon('spark', 24) }}</span>
      <b style="font-size: 16px; color: var(--ink)">Чем помочь?</b>
      <span class="small">Я вижу ваши задачи, проекты, сроки и рабочий стол. Предложу план, а задачи, заметки и записи в журнал заведу сам — после вашего «Применить».</span>
      <div class="chat-suggest">
        <button class="chip-btn" type="button" data-ask="С чего мне начать сегодня? Учти сроки и приоритеты.">С чего начать сегодня?</button>
        <button class="chip-btn" type="button" data-ask="Где риски в моих проектах и что сделать, чтобы успеть в срок?">Где риски?</button>
        <button class="chip-btn" type="button" data-ask="Декомпозируй проект на задачи с дедлайнами, частями и оценками.">Декомпозиция задач</button>
        <button class="chip-btn" type="button" data-ask="Составь мне план на эту неделю по дням.">План на неделю</button>
      </div>
    </div>
  </div>
  <form class="chat-input" data-chat-form>
    <div class="ci-wrap">
      <textarea class="textarea" data-autosize rows="1" placeholder="Спросите ИИ, попросите разбить на шаги или изменить дедлайны…" aria-label="Вопрос ИИ"></textarea>
      <div class="ci-actions">
        <button class="btn btn-accent ci-send" type="submit" aria-label="Отправить" title="Отправить">{{ icon('send', 17) }}</button>
        <button class="btn btn-danger ci-stop" type="button" data-chat-stop aria-label="Прервать" title="Прервать генерацию" hidden>{{ icon('stop', 16) }}</button>
      </div>
    </div>
  </form>
</div>
