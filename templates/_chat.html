{% from '_icons.html' import icon %}
<div class="chat" data-chat {% if chat_thread %}data-thread="{{ chat_thread }}"{% endif %} {% if chat_ask %}data-ask="{{ chat_ask }}"{% endif %}>
  <div class="chat-log" data-chat-log>
    <div class="chat-empty" data-chat-empty>
      <div class="ai-welcome-badge">
        <span class="ai-mark lg">{{ icon('spark', 26) }}</span>
      </div>
      <h2 class="welcome-title">Чем помочь сегодня?</h2>
      <p class="welcome-desc">Я вижу ваши задачи, проекты, дедлайны и рабочий стол. Составлю план действий или подготовлю нужные сущности.</p>
      <div class="chat-suggest-grid">
        <button class="suggest-card" type="button" data-ask="С чего мне начать сегодня? Учти сроки и приоритеты.">
          <div class="sc-title">С чего начать сегодня?</div>
          <div class="sc-sub">С учётом дедлайнов и приоритетов</div>
        </button>
        <button class="suggest-card" type="button" data-ask="Где риски в моих проектах и что сделать, чтобы успеть в срок?">
          <div class="sc-title">Где риски в проектах?</div>
          <div class="sc-sub">Анализ узких мест и задержек</div>
        </button>
        <button class="suggest-card" type="button" data-ask="Декомпозируй проект на задачи с дедлайнами, частями и оценками.">
          <div class="sc-title">Декомпозиция задач</div>
          <div class="sc-sub">Пошаговая разбивка проекта</div>
        </button>
        <button class="suggest-card" type="button" data-ask="Составь мне план на эту неделю по дням.">
          <div class="sc-title">План на неделю</div>
          <div class="sc-sub">Распределение нагрузки по дням</div>
        </button>
      </div>
    </div>
  </div>
  <div class="chat-bottom-bar">
    <form class="chat-input" data-chat-form>
      <div class="ci-container">
        <div class="ci-wrap">
          <textarea class="textarea" data-autosize rows="1" placeholder="Спросите ИИ, попросите разбить на шаги или изменить дедлайны…" aria-label="Вопрос ИИ"></textarea>
          <div class="ci-actions">
            <button class="btn btn-accent ci-send" type="submit" aria-label="Отправить" title="Отправить">{{ icon('send', 17) }}</button>
            <button class="btn btn-danger ci-stop" type="button" data-chat-stop aria-label="Прервать" title="Прервать генерацию" hidden>{{ icon('stop', 16) }}</button>
          </div>
        </div>
      </div>
      <div class="chat-disclaimer">UNIT AI может ошибаться. Проверяйте важную информацию.</div>
    </form>
  </div>
</div>
