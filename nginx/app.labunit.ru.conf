# app.labunit.ru → 127.0.0.1:5008. Установка: cp в /etc/nginx/sites-available, ln -s в sites-enabled,
# nginx -t && systemctl reload nginx, затем certbot --nginx -d app.labunit.ru (добавит HTTPS и редирект).
server {
    listen 80;
    listen [::]:80;
    server_name app.labunit.ru;
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:5008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
